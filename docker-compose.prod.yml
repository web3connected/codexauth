version: '3.8'

services:
  codexauth-api:
    container_name: codexauth-api-prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8083:80"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
